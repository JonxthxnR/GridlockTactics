<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridlock Tactics: Trench Korps - Sandbox IA</title>
    <link rel="stylesheet" href="ui/style.css">
</head>
<body>
    <header>
        <h1>BATTLE AI: LABORATORIO TÁCTICO (SANDBOX)</h1>
    </header>
    
    <main class="contenedor-principal">
        <!-- Panel de Control para alterar estadísticas y pesos en vivo -->
        <aside class="panel-controles">
            <h3>[PARÁMETROS TÁCTICOS]</h3>
            <div class="grupo-control">
                <label>HP Soldado IA:</label>
                <input type="number" id="input-hp-ia" value="10" min="1" max="20">
            </div>
            <div class="grupo-control">
                <label>HP Soldado Jugador:</label>
                <input type="number" id="input-hp-jugador" value="10" min="1" max="20">
            </div>
            <div class="grupo-control">
                <label>Profundidad Minimax (d):</label>
                <input type="number" id="input-profundidad" value="2" min="1" max="4">
            </div>

            <h3>[PESOS HEURÍSTICOS]</h3>
            <div class="grupo-control">
                <label>Peso w1 (HP IA):</label>
                <input type="number" id="input-w1" value="1.0" step="0.1">
            </div>
            <div class="grupo-control">
                <label>Peso w2 (HP Jugador):</label>
                <input type="number" id="input-w2" value="1.0" step="0.1">
            </div>
            <div class="grupo-control">
                <label>Peso w3 (Cobertura):</label>
                <input type="number" id="input-w3" value="0.5" step="0.1">
            </div>
            <div class="grupo-control">
                <label>Peso w4 (Amenaza):</label>
                <input type="number" id="input-w4" value="1.5" step="0.1">
            </div>

            <button id="btn-calcular" class="btn-tactico">EJECUTAR MINIMAX</button>
        </aside>

        <!-- Tablero Visual -->
        <section>
            <div id="tablero-juego" class="contenedor-tablero"></div>
        </section>
    </main>

    <!-- Panel de Resultados del Minimax -->
    <section id="panel-metricas" class="panel-metricas">
        <h3>[DIAGNÓSTICO DEL ÁRBOL DE DECISIONES]</h3>
        <p>Modifica los parámetros y presiona "Ejecutar Minimax".</p>
    </section>

    <script type="module" src="main.js"></script>
</body>
</html>
