<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridlock Tactics: Trench Korps</title>
    <link rel="stylesheet" href="ui/style.css">
</head>
<body>
    <header>
        <h1>GRIDLOCK TACTICS: TRENCH KORPS</h1>
    </header>
    
    <main class="contenedor-principal">
        <!-- Panel de Control de Partida y Parámetros IA -->
        <aside class="panel-controles">
            <h3>[ESTADO DE BATALLA]</h3>
            <p id="indicador-turno" style="color: #00ffcc; font-weight: bold;">TURNO: JUGADOR</p>
            <p id="info-unidad" style="font-size: 0.78rem; color: #aaa;">Selecciona una unidad verde [F: Fusilero | T: Tirador | G: Granadero].</p>
            
            <button id="btn-fin-turno" class="btn-tactico btn-fin-turno">FINALIZAR TURNO</button>
            <button id="btn-reiniciar" class="btn-tactico">REINICIAR ESCARAMUZA</button>

            <h3 style="margin-top: 18px;">[CONFIGURACIÓN IA]</h3>
            <div class="grupo-control">
                <label>Profundidad Búsqueda (d):</label>
                <input type="number" id="input-profundidad" value="2" min="1" max="3">
            </div>
            <div class="grupo-control">
                <label>Peso P1 (HP IA):</label>
                <input type="number" id="input-p1" value="1.0" step="0.1">
            </div>
            <div class="grupo-control">
                <label>Peso P2 (HP Jugador):</label>
                <input type="number" id="input-p2" value="1.0" step="0.1">
            </div>
            <div class="grupo-control">
                <label>Peso P3 (Cobertura):</label>
                <input type="number" id="input-p3" value="0.5" step="0.1">
            </div>
            <div class="grupo-control">
                <label>Peso P4 (Amenaza):</label>
                <input type="number" id="input-p4" value="1.5" step="0.1">
            </div>
        </aside>

        <!-- Tablero Táctico -->
        <section>
            <div id="tablero-juego" class="contenedor-tablero"></div>
        </section>
    </main>

    <!-- Panel de Telemetría y Registro Táctico en Vivo -->
    <section class="panel-metricas" style="width: 760px; max-width: 95vw;">
        <h3>[REGISTRO TÁCTICO Y TELEMETRÍA EN VIVO]</h3>
        <div id="log-combate" class="log-combate"></div>
    </section>

    <!-- Panel de Estadísticas y Gráfica Comparativa Post-Partida -->
    <section id="panel-postpartida" class="panel-postpartida" style="display: none;"></section>

    <script type="module" src="main.js"></script>
</body>
</html>
