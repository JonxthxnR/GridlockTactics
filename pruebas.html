<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridlock Tactics - Sandbox de Pruebas Mínimas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Roboto+Condensed:wght@400;700&display=swap');

        :root {
            --bg-color: #0d0e11;
            --panel-bg: #16181d;
            --accent: #d97706;
            --danger: #dc2626;
            --success: #16a34a;
            --border: #2d3139;
            --text: #d1d5db;
        }

        body {
            font-family: 'Roboto Condensed', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .sandbox-container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-bg);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            text-align: center;
            color: var(--accent);
            margin: 0 0 4px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: #8b929e;
            margin-bottom: 16px;
        }

        .preset-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }

        .btn-preset {
            background: #22262e;
            border: 1px solid var(--border);
            color: #9ca3af;
            font-size: 0.72rem;
            padding: 6px 2px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-preset:hover { background: var(--border); color: #fff; }

        .section-title {
            font-size: 0.85rem;
            color: var(--accent);
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            padding-bottom: 3px;
            margin-bottom: 10px;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .form-group { display: flex; flex-direction: column; gap: 3px; }
        label { font-size: 0.75rem; color: #9ca3af; }
        input, select {
            background: #090a0c;
            border: 1px solid var(--border);
            color: #fff;
            padding: 7px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .btn-run {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
        }
        .btn-run:hover { opacity: 0.9; }

        .status-box {
            margin-top: 14px;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.82rem;
            display: none;
        }
        .status-box.error { background: rgba(220, 38, 38, 0.2); border: 1px solid var(--danger); color: #fca5a5; }
        .status-box.ok { background: rgba(22, 163, 74, 0.2); border: 1px solid var(--success); color: #86efac; }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 14px;
        }

        .metric-card {
            background: #090a0c;
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 4px;
        }
        .metric-card label { display: block; font-size: 0.68rem; color: #6b7280; }
        .metric-card span { font-size: 1rem; font-weight: bold; color: #fff; }

        .test-log-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
            font-size: 0.7rem;
        }
        .test-log-table th, .test-log-table td {
            border: 1px solid var(--border);
            padding: 5px;
            text-align: left;
        }
        .test-log-table th { background: #090a0c; color: var(--accent); }
        .badge-pass { color: #4ade80; font-weight: bold; }
        .badge-fail { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>

<div class="sandbox-container">
    <h1>Gridlock Tactics</h1>
    <div class="subtitle">Panel de Pruebas de Funcionalidades Mínimas</div>

    <!-- BOTONES DE CARGA RÁPIDA DE CASOS Y NAVEGACIÓN -->
    <div class="preset-bar">
        <button class="btn-preset" onclick="window.location.href='index.html'">&larr; Menú</button>
        <button class="btn-preset" onclick="cargarCaso(1)">Caso 1: Válido</button>
        <button class="btn-preset" onclick="cargarCaso(2)">Caso 2: Violación AP</button>
        <button class="btn-preset" onclick="cargarCaso(3)">Caso 3: Cobertura</button>
        <button class="btn-preset" onclick="window.location.href='resultados.html'">Métricas &rarr;</button>
    </div>

    <!-- ENTRADAS DE DATOS -->
    <div class="section-title">Parámetros de Entrada</div>
    <div class="grid-inputs">
        <div class="form-group">
            <label>AP Disponibles</label>
            <input type="number" id="ap-disponibles" value="3">
        </div>
        <div class="form-group">
            <label>Costo AP de Jugada</label>
            <input type="number" id="ap-costo" value="2">
        </div>
        <div class="form-group">
            <label>HP Jugador</label>
            <input type="number" id="hp-jugador" value="10">
        </div>
        <div class="form-group">
            <label>HP IA</label>
            <input type="number" id="hp-ia" value="10">
        </div>
        <div class="form-group">
            <label>Cobertura IA (+Def)</label>
            <select id="cobertura-ia">
                <option value="2">Trinchera (+2)</option>
                <option value="0">Libre (0)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Amenaza Jugador</label>
            <input type="number" id="amenaza-jugador" value="1">
        </div>
    </div>

    <button class="btn-run" onclick="ejecutarPrueba()">PROCESAR FUNCIONALIDAD</button>

    <!-- CAJA DE ESTADO / ALERTAS -->
    <div id="status-box" class="status-box"></div>

    <!-- SALIDAS Y MÉTRICAS DE EVALUACIÓN -->
    <div class="section-title" style="margin-top:14px;">Salidas del Algoritmo</div>
    <div class="metrics-grid">
        <div class="metric-card">
            <label>PUNTAJE HEURÍSTICO f(s)</label>
            <span id="out-fs" style="color:var(--accent);">-</span>
        </div>
        <div class="metric-card">
            <label>TIEMPO DE CÓMPUTO</label>
            <span id="out-tiempo">-</span>
        </div>
        <div class="metric-card" style="grid-column: span 2;">
            <label>DECISIÓN RECOMENDADA</label>
            <span id="out-decision" style="font-size:0.85rem;">-</span>
        </div>
    </div>

    <!-- LOG DE PRUEBAS PARA EL INFORME -->
    <div class="section-title" style="margin-top:14px;">Historial de Pruebas Realizadas</div>
    <table class="test-log-table">
        <thead>
            <tr>
                <th>Prueba</th>
                <th>AP (Disp/Req)</th>
                <th>f(s)</th>
                <th>Resultado Obligatorio</th>
            </tr>
        </thead>
        <tbody id="log-body">
            <tr>
                <td colspan="4" style="text-align:center; color:#6b7280;">Ninguna prueba ejecutada aún.</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    let testCounter = 1;

    function cargarCaso(numero) {
        if (numero === 1) {
            document.getElementById('ap-disponibles').value = 3;
            document.getElementById('ap-costo').value = 2;
            document.getElementById('cobertura-ia').value = 2;
            document.getElementById('amenaza-jugador').value = 1;
        } else if (numero === 2) {
            document.getElementById('ap-disponibles').value = 3;
            document.getElementById('ap-costo').value = 5;
            document.getElementById('cobertura-ia').value = 2;
        } else if (numero === 3) {
            document.getElementById('ap-disponibles').value = 3;
            document.getElementById('ap-costo').value = 2;
            document.getElementById('cobertura-ia').value = 0;
            document.getElementById('amenaza-jugador').value = 4;
        }
    }

    function ejecutarPrueba() {
        const apDisp = parseInt(document.getElementById('ap-disponibles').value);
        const apCosto = parseInt(document.getElementById('ap-costo').value);
        const hpJugador = parseInt(document.getElementById('hp-jugador').value);
        const hpIA = parseInt(document.getElementById('hp-ia').value);
        const cobertura = parseInt(document.getElementById('cobertura-ia').value);
        const amenaza = parseInt(document.getElementById('amenaza-jugador').value);

        const statusBox = document.getElementById('status-box');
        const logBody = document.getElementById('log-body');

        if (testCounter === 1) logBody.innerHTML = '';

        // VALIDACIÓN DE RESTRICCIÓN OBLIGATORIA
        if (apCosto > apDisp) {
            statusBox.className = 'status-box error';
            statusBox.style.display = 'block';
            statusBox.innerHTML = `<strong>¡RESTRICCIÓN VIOLADA!</strong><br>Costo de AP (${apCosto}) excede los AP disponibles (${apDisp}). La acción fue bloqueada.`;
            
            document.getElementById('out-fs').innerText = 'N/A';
            document.getElementById('out-tiempo').innerText = '0.00 ms';
            document.getElementById('out-decision').innerText = 'Acción Inválida';

            agregarLogRecord(testCounter++, `${apDisp} / ${apCosto}`, 'N/A', 'RESTRICCIÓN RECHAZADA', false);
            return;
        }

        // PROCESAMIENTO ALGORÍTMICO
        const t0 = performance.now();
        const w1 = 3, w2 = 3, w3 = 4, w4 = 2;
        const fs = (w1 * hpIA) - (w2 * hpJugador) + (w3 * cobertura) - (w4 * amenaza);
        const t1 = performance.now();
        const tiempoMs = (t1 - t0).toFixed(2);

        // Guardar en localStorage para la pantalla de resultados
        localStorage.setItem('ultimo_fs', fs);
        localStorage.setItem('ultimo_tiempo', tiempoMs);

        statusBox.className = 'status-box ok';
        statusBox.style.display = 'block';
        statusBox.innerHTML = `<strong>¡EJECUCIÓN EXITOSA!</strong><br>Restricción validada. Entrada procesada correctamente.`;

        document.getElementById('out-fs').innerText = fs;
        document.getElementById('out-tiempo').innerText = tiempoMs + ' ms';
        document.getElementById('out-decision').innerText = fs >= 6 ? 'Avanzar a Trinchera (Ofensivo)' : 'Maniobra Defensiva';

        agregarLogRecord(testCounter++, `${apDisp} / ${apCosto}`, fs, 'VÁLIDO Y CALCULADO', true);
    }

    function agregarLogRecord(id, apInfo, fsVal, resText, isPass) {
        const logBody = document.getElementById('log-body');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>#${id}</td>
            <td>${apInfo}</td>
            <td>${fsVal}</td>
            <td><span class="${isPass ? 'badge-pass' : 'badge-fail'}">${resText}</span></td>
        `;
        logBody.appendChild(row);
    }
</script>

</body>
</html>
